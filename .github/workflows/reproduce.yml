name: Numerical reproduction
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-numerical.txt
      - run: python study/verify_repository.py
      - run: python study/reproduce_supplement.py
      - run: python study/check_geometry.py
      - run: python -m unittest discover -s study -p test_policy.py
      - run: python -m unittest discover -s study -p test_portability.py
      - run: python -m unittest discover -s study -p test_training_records.py
